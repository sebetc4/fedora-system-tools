language   = "english"
versioning = "git"

[roadmap]
root = "docs/roadmap"

[git]
push   = "auto"
branch = "default"
commit = "{type}[({scope})][!]: {description}"

[skills]
dirs      = [".claude/skills"]
evals     = "evals"
workspace = ".eval-runs"
address   = "agent"
exclude   = ["dynamic-context", "substitutions"]

[session]
notes         = "notes/sessions"
# start_notes = 3   (default)
