language   = "english"
versioning = "git"
checks     = ["make shellcheck", "make test"]

[roadmap]
root = "docs/roadmap"

[docs]
root  = "docs"
notes = "notes"

[git]
push   = "auto"
branch = "default"
commit = "{type}[({scope})][!]: {description}"

[skills]
dirs      = [".claude/skills"]
evals     = "evals"
workspace = ".eval-runs"
address   = "agent"
exclude   = ["dynamic-context", "substitutions"]

[session]
notes         = "notes/sessions"
# start_notes = 3   (default)
