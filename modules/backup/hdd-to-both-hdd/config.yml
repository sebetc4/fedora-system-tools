# ============================================================================
# HDD SPLIT BACKUP CONFIGURATION
# ============================================================================
# Split backup from a source drive to two separate backup drives,
# with different folder selections per drive.
#
# Use case: Split large backup across two drives, or backup critical data
# to one drive and media to another.
# Default location: ~/.config/backup/hdd-both.yml
# ============================================================================

# ============================================================================
# SOURCE DRIVE (active storage)
# ============================================================================
source:
  path: /mnt/storage
  label: Storage

# ============================================================================
# BACKUP DRIVE 1
# ============================================================================
backup_drive_1:
  path: /mnt/backup1
  label: Backup1

  # Directories to backup to this drive (relative to source path)
  # If no subfolders specified, the entire folder is backed up
  folders:
    - path: Documents
      subfolders:
        - Personal
        - Work

    - path: Photos
      subfolders:
        - 2024
        - 2025

  # BTRFS snapshots before backup (optional, requires BTRFS)
  snapshots:
    # Enable/disable snapshots before backup
    enabled: false

    # Where to store snapshots (relative to backup drive path)
    directory: .snapshots

    # Number of snapshots to keep (older ones auto-deleted)
    retention: 3

    # Snapshot naming format (date will be appended)
    prefix: backup

# ============================================================================
# BACKUP DRIVE 2
# ============================================================================
backup_drive_2:
  path: /mnt/backup2
  label: Backup2

  # Directories to backup to this drive (can differ from drive 1)
  folders:
    - path: Music
    - path: Videos

  # BTRFS snapshots before backup (optional, requires BTRFS)
  snapshots:
    # Enable/disable snapshots before backup
    enabled: false

    # Where to store snapshots (relative to backup drive path)
    directory: .snapshots

    # Number of snapshots to keep (older ones auto-deleted)
    retention: 3

    # Snapshot naming format (date will be appended)
    prefix: backup

# ============================================================================
# EXCLUSIONS
# ============================================================================
# Patterns excluded from all backups (rsync --exclude)
exclude:
  - "*.tmp"
  - "*.cache"
  - ".Trash-*"
  - "lost+found"

# ============================================================================
# RSYNC OPTIONS
# ============================================================================
rsync:
  # Delete files in destination not present in source
  delete: true

  # Show progress during transfer
  progress: true

  # Compress during transfer (not needed for local backup)
  compress: false

  # Preserve all attributes
  archive: true

  # Keep partial transfers on interruption (allows resuming)
  partial: true

  # Write updated data directly to destination file (no temp file)
  # Saves disk space on drives with limited free space
  inplace: false

# ============================================================================
# BTRFS OPTIONS
# ============================================================================
btrfs:
  # Run scrub after backup (integrity check)
  scrub_after_backup: false

  # Show compression statistics after backup
  show_compression_stats: false

# ============================================================================
# LOGGING
# ============================================================================
logging:
  # Log file path (rotation managed by logrotate, see /etc/logrotate.d/backup-scripts)
  # Leave empty for console-only output
  file: /var/log/backup/backup-hdd-both.log

# ============================================================================
# SAFETY OPTIONS
# ============================================================================
safety:
  # Require confirmation before starting backup
  confirm_before_start: true

  # Check disk space before backup
  check_disk_space: true

  # Dry run mode (simulate without making changes)
  dry_run: false

# ============================================================================
# NOTES
# ============================================================================
#
# Folder Configuration:
#   - path: Main folder name (relative to source.path)
#   - subfolders: (optional) List of subfolders to backup
#   - If no subfolders specified, entire folder is backed up
#
# Example Use Cases:
#   1. Critical data to Drive 1, media to Drive 2
#   2. Recent files to Drive 1, archives to Drive 2
#   3. Selective backup of large folder trees
#
# Drive Selection:
#   Use -d option to backup to a specific drive:
#   backup.sh -d 1       # Backup to drive 1 only
#   backup.sh -d 2       # Backup to drive 2 only
#   backup.sh -d both    # Backup to both drives (default)
#
# ============================================================================
